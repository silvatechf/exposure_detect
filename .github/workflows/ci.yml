name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exposureguard
          POSTGRES_PASSWORD: ci-postgres-password-012345
          POSTGRES_DB: exposureguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exposureguard -d exposureguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          EG_TEST_DATABASE_URL: postgresql+psycopg://exposureguard:ci-postgres-password-012345@localhost:5432/exposureguard
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Check dependency consistency
        run: python -m pip check
