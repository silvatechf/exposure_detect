[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exposureguard"
version = "0.3.2"
description = "Lightweight exposure-posture scanner for connected devices: exposed services, default credentials and secure-by-default checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29",
  "pydantic>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "pip-audit>=2.7", "httpx2>=2.0,<3.0"]

[project.scripts]
eg = "exposureguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exposureguard = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "E501", "B008"]
